<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" xmlns:ns1="http://www.w3.org/1999/xlink" width="720pt" height="360pt" viewBox="0 0 720 360" version="1.1" role="img" aria-labelledby="panel-title panel-desc">
 <ns0:title id="panel-title">Preference matching and predictive risk select different forecasts</ns0:title><ns0:desc id="panel-desc">Y~Bernoulli(0.7), forecast q∈[0,1], preference law Bernoulli(0.2); Brier loss (q−Y)². E[(q−Y)²]=0.21+(q−0.7)²; preference objective KL(Bernoulli(q)||Bernoulli(0.2)). Bayes forecast q=0.7 minimizes Brier risk; q=0.2 minimizes preference KL. This specified comparison is not a general EFE formula or an empirical calibration result.</ns0:desc><ns0:defs>
