<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" xmlns:ns1="http://www.w3.org/1999/xlink" width="720pt" height="360pt" viewBox="0 0 720 360" version="1.1" role="img" aria-labelledby="panel-title panel-desc">
 <ns0:title id="panel-title">Equal observed laws retain unequal hidden laws</ns0:title><ns0:desc id="panel-desc">Independent elementary two-coordinate Gaussian OU obstruction (not the native H3 model), rates (1,2), stationary covariance I, initial means (1,0) and (1,3); t≥0. μ1(t)=(e^(−t),0); μ2(t)=(e^(−t),3e^(−2t)); KL(full1||full2)=9e^(−4t)/2; KL(observed1||observed2)=0. Projection retains only coordinate 1. These displayed values concern one-time Gaussian laws; no sampled paths, process-existence receipt, or hidden-state identification is supplied.</ns0:desc><ns0:defs>
  <ns0:style type="text/css">*{stroke-linejoin: round; stroke-linecap: butt}</ns0:style>
 </ns0:defs>
