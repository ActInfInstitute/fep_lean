<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" xmlns:ns1="http://www.w3.org/1999/xlink" width="720pt" height="360pt" viewBox="0 0 720 360" version="1.1" role="img" aria-labelledby="panel-title panel-desc">
 <ns0:title id="panel-title">Tangent information and a redundant coordinate</ns0:title><ns0:desc id="panel-desc">Bernoulli 0&lt;p&lt;1; duplicated Gaussian mean θ1+θ2 with fixed variance σ²=2. I_B(p)=1/[p(1−p)]=(d(2 asin √p)/dp)²; I_G=½[[1,1],[1,1]]. Categorical metric is regular on the simplex tangent. Duplicating a mean coordinate adds a null direction, not an identifiable dimension. Endpoints are excluded from Bernoulli Fisher.</ns0:desc><ns0:defs>
  <ns0:style type="text/css">*{stroke-linejoin: round; stroke-linecap: butt}</ns0:style>
 </ns0:defs>
